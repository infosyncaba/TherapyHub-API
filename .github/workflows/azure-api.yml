# Despliega el API a Azure App Service.
# Mientras dure la migración solo corre con la rama migracion-azure.
# Render sigue desplegando master por su integración propia; este workflow no lo afecta.
name: Deploy API to Azure

on:
  push:
    branches: [migracion-azure]
  workflow_dispatch:

permissions:
  id-token: write   # login a Azure con OIDC, sin guardar claves en GitHub
  contents: read

env:
  AZURE_WEBAPP_NAME: syncaba-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish TherapuHubAPI/TherapuHubAPI.csproj -c Release -o ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
